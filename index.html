<style>
/* Layout: drafting-office workbench. Sticky title-block header with the punch clock, a left rail of sections (top strip on phones), one working column, and a job sheet that slides in from the right. */
:root {
  --paper: #f3f5f4; --sheet: #ffffff; --sheet-2: #edf1ef; --rail: #e7ecea;
  --line: #d3dbd8; --line-2: #bcc7c3;
  --ink: #172022; --ink-2: #566562; --ink-3: #7d8b88;
  --accent: #0e5e6f; --accent-2: #0b4c5a; --accent-soft: #d9eaed; --accent-fg: #ffffff;
  --warn: #8a5a00; --warn-soft: #fbefd0; --good: #1f6b3a; --good-soft: #dcf0e2; --bad: #b3261e; --bad-soft: #f9e3e1;
  --scrim: rgba(16, 24, 26, .38); --shadow: 0 18px 48px rgba(16, 30, 34, .18);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1517; --sheet: #162023; --sheet-2: #1c272b; --rail: #121a1d;
    --line: #2a373b; --line-2: #3a4a4f; --ink: #e4ecec; --ink-2: #9aabab; --ink-3: #74878a;
    --accent: #5cc0d6; --accent-2: #86d3e4; --accent-soft: #15343b; --accent-fg: #062227;
    --warn: #f2c25b; --warn-soft: #3a2e12; --good: #7fd49a; --good-soft: #173424; --bad: #ff8a80; --bad-soft: #3b1f1d;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 18px 48px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1517; --sheet: #162023; --sheet-2: #1c272b; --rail: #121a1d;
  --line: #2a373b; --line-2: #3a4a4f; --ink: #e4ecec; --ink-2: #9aabab; --ink-3: #74878a;
  --accent: #5cc0d6; --accent-2: #86d3e4; --accent-soft: #15343b; --accent-fg: #062227;
  --warn: #f2c25b; --warn-soft: #3a2e12; --good: #7fd49a; --good-soft: #173424; --bad: #ff8a80; --bad-soft: #3b1f1d;
  --scrim: rgba(0, 0, 0, .55); --shadow: 0 18px 48px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

/* ---------- frame ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; align-content: start; min-height: 100vh; }
.top { grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap; padding-block: 10px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 15px; letter-spacing: .04em; color: var(--accent-fg); background: var(--accent);
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 4px; flex: 0 0 auto; }
.brand h1 { font-size: 21px; font-weight: 750; line-height: 1.1; }
.today { font-family: var(--f-data); font-size: 12px; color: var(--ink-2); }
.titlerow { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; min-width: 0; }
button.mark { border: 0; cursor: pointer; padding: 0; font-family: var(--f-display); transition: box-shadow .12s; }
button.mark:hover, button.mark[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--accent-soft); }
.pmwrap { position: relative; flex: 0 0 auto; }
.pagemenu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 35; min-width: 240px; max-width: min(320px, calc(100vw - 32px)); background: var(--sheet); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.kwrap { position: relative; }
.syncb { position: relative; }
.syncb .sdot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); box-shadow: 0 0 0 2px var(--sheet); }
.syncb .sdot.ok { background: var(--good); } .syncb .sdot.bad { background: var(--bad); } .syncb .sdot.busy { background: var(--accent); }
.syncb.spin svg { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.btn.syncb[data-state=perm], .btn.syncb[data-state=err] { background: var(--bad); border-color: var(--bad); color: #fff; } .syncb[data-state=perm] .sdot, .syncb[data-state=err] .sdot { display: none; }
@media (max-width: 1440px) { .syncb .sl { display: none; } .syncb[data-state=perm] .sl, .syncb[data-state=err] .sl { display: inline; } }
.synckv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; } .synckv dt { color: var(--ink-3); } .synckv dd { margin: 0; overflow-wrap: anywhere; }
.syncf { display: flex; flex-direction: column; gap: 10px; } .syncf .f { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; } .syncf .field { width: 100%; font-weight: 400; }
.syncerr { color: var(--bad); font-size: 13px; } code.k { font-family: var(--f-mono, monospace); font-size: 12px; background: var(--paper); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.kebab { font-size: 20px; line-height: 1; padding: 6px 12px; }
.kebab[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.appmenu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 35; min-width: 230px; background: var(--sheet); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.appmenu[hidden] { display: none !important; }
.appmenu button { text-align: left; background: transparent; border: 0; border-radius: 4px; padding: 9px 10px; cursor: pointer; font-size: 14px; color: var(--ink); }
.appmenu button:hover { background: var(--sheet-2); }
.appmenu button.danger { color: var(--bad); }
.appmenu button.danger.armed { background: var(--bad); color: #fff; }
.appmenu .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.appmenu .ml { font-size: 11px; color: var(--ink-3); padding: 4px 10px 6px; }
ol.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.pagemenu .ml { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 6px 10px 4px; }
.pagemenu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 4px; padding: 8px 10px; cursor: pointer; font-size: 14px; color: var(--ink); }
.pagemenu button:hover { background: var(--sheet-2); }
.pagemenu button[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pagemenu .pfx { font-family: var(--f-data); font-size: 11px; min-width: 30px; text-align: center; padding: 2px 4px; border-radius: 3px; background: var(--sheet-2); color: var(--ink-2); }
.dangerzone { border-color: var(--bad); }
.dangerzone h3 { color: var(--bad); }
.pagemenu .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.plus { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--sheet); color: var(--accent); font-size: 18px; line-height: 1; font-weight: 600; cursor: pointer; display: grid; place-items: center; padding: 0 0 2px; }
.plus:hover { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.pagerow { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pagesel { font-family: var(--f-body); font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 3px 26px 3px 10px; max-width: 240px; cursor: pointer; }
.gear { background: none; border: 0; color: var(--ink-3); cursor: pointer; font-size: 12px; padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px; }
.gear:hover { color: var(--accent); }
.pagerow .today { margin-left: 4px; }
.top .spacer { flex: 1 1 0; }

.punch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.punch select { max-width: 260px; }
.punch.live { background: var(--good-soft); border: 1px solid var(--good); border-radius: var(--r); padding: 5px 6px 5px 12px; }
.punch .pl { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.punch .pl b { font-family: var(--f-data); font-weight: 500; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: 0 0 auto; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph, 60px)); z-index: 15; display: flex; flex-direction: row; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; background: var(--rail); border-bottom: 1px solid var(--line); padding-block: 6px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.nav { flex: 1 1 0; min-width: 0; justify-content: center; text-align: center; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; background: transparent; border: 0; border-radius: var(--r); padding: 8px 14px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
.nav:hover { background: var(--sheet-2); color: var(--ink); }
.nav[aria-selected="true"] { background: var(--sheet); color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.nav .k { font-family: var(--f-data); font-size: 11px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
.nav .k.hot { color: var(--bad); }
.rail .foot { display: none; }

main { min-width: 0; align-self: start; padding-block: 20px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.view { display: flex; flex-direction: column; gap: 18px; width: 100%; }
.vhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.vhead h2 { font-size: 26px; font-weight: 750; }
.vtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

@media (max-width: 820px) {
  .rail { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .rail { gap: 2px; overflow-x: hidden; }
  .nav { padding: 6px 2px; flex-direction: column; gap: 0; font-size: 13.5px; }
  .nav .k { font-size: 10px; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; }
  .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top .spacer { display: none; }
  .brand { flex: 1 1 auto; }
  #bk-btn, #kwrap { order: 2; }
  .kwrap { position: static; }
  .appmenu { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + var(--toph, 60px) + 6px); min-width: 0; max-height: calc(100vh - var(--toph, 60px) - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
  .appmenu button { padding: 12px 12px; font-size: 15px; }
  .punch { order: 3; flex: 1 1 100%; flex-wrap: nowrap; }
  .punch #p-job { flex: 1 1 auto; max-width: none; }
  .punch #p-type { flex: 0 0 104px; }
  .punch .pl { flex: 1 1 auto; }
  .vhead h2 { font-size: 22px; }
}

/* ---------- controls ---------- */
.field { background: var(--sheet); border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 10px; min-width: 0; font-size: 14px; }
.field:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.field { resize: vertical; width: 100%; }
.btn { border-radius: var(--r); padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: var(--sheet); border-color: var(--line-2); color: var(--ink-2); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.quiet { background: transparent; color: var(--ink-2); padding: 6px 10px; }
.btn.quiet:hover { color: var(--accent); background: var(--sheet-2); }
.btn.out { background: var(--sheet); border-color: var(--bad); color: var(--bad); }
.btn.danger { background: transparent; border-color: var(--line-2); color: var(--ink-2); }

.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg .k { font-family: var(--f-data); font-weight: 500; font-size: 11px; margin-left: 5px; opacity: .8; }
.search { flex: 1 1 240px; min-width: 0; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- title-block KPI strip ---------- */
.tblock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--sheet); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.tblock > div { padding: 12px 16px; min-width: 0; border-left: 1px solid var(--line); }
.tblock > div:first-child { border-left: 0; }
.tblock .l { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.tblock .n { font-family: var(--f-data); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.25; margin-top: 2px; overflow-wrap: anywhere; }
.tblock .s { font-size: 12px; color: var(--ink-2); }
.tblock .warn .n { color: var(--warn); } .tblock .good .n { color: var(--good); } .tblock .bad .n { color: var(--bad); }
.meter { height: 4px; background: var(--sheet-2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
@media (max-width: 640px) { .tblock { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tblock > div:nth-child(3) { border-left: 0; } .tblock > div:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* ---------- panels, groups ---------- */
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.accent { border-color: var(--accent); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ph h3 { font-size: 17px; font-weight: 700; }
.glabel { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 4px 0 -8px; }
.glabel .c { font-family: var(--f-data); font-weight: 500; letter-spacing: 0; }
.muted { color: var(--ink-2); font-size: 13px; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 28px 18px; text-align: center; color: var(--ink-2); background: var(--sheet); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; font-family: var(--f-display); font-stretch: 85%; }
.grid-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.grid-form .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.grid-form .f .field { width: 100%; font-weight: 400; color: var(--ink); }
.grid-form .w2 { grid-column: span 2; } .grid-form .w4 { grid-column: 1 / -1; }
.grid-form .row { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.grid-form .row .hint { margin-right: auto; font-family: var(--f-data); font-size: 12px; color: var(--ink-2); font-weight: 400; }
@media (max-width: 640px) { .grid-form { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-form .w2 { grid-column: 1 / -1; } }

/* ---------- job rows ---------- */
.tag { font-family: var(--f-data); font-size: 12.5px; font-weight: 500; color: var(--ink); background: var(--sheet-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 2px 7px; white-space: nowrap; }
.jlist { display: flex; flex-direction: column; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.jrow { display: grid; grid-template-columns: 6px auto minmax(0, 1fr) auto auto; align-items: center; gap: 4px 14px; padding: 11px 14px 11px 0; cursor: pointer; border-top: 1px solid var(--line); }
.jrow:first-child { border-top: 0; }
.jrow:hover { background: var(--sheet-2); }
.jrow .stripe { align-self: stretch; margin: -11px 0; background: var(--line); }
.jrow.s-ongoing .stripe { background: var(--warn); } .jrow.s-done .stripe { background: var(--good); }
.jmain { min-width: 0; }
.jl1 { font-weight: 600; overflow-wrap: anywhere; }
.jl1 .ref { font-family: var(--f-data); font-size: 12px; font-weight: 400; color: var(--accent); margin-left: 6px; }
.jl2 { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jmeta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font-family: var(--f-data); font-size: 11.5px; padding: 2px 7px; border-radius: 3px; background: var(--sheet-2); color: var(--ink-2); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.acc { background: var(--accent-soft); color: var(--accent); }
.jrow.s-done .jl1 { color: var(--ink-2); font-weight: 500; }
select.status { border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--line-2); background: var(--sheet-2); cursor: pointer; }
select.status.s-ongoing { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
select.status.s-done { background: var(--good-soft); color: var(--good); border-color: transparent; }
@media (max-width: 640px) {
  .jrow { grid-template-columns: 6px minmax(0, 1fr) auto; gap: 6px 12px; }
  .jrow .stripe { grid-row: 1 / 4; grid-column: 1; }
  .jrow .tag { grid-row: 1; grid-column: 2; justify-self: start; }
  .jrow select.status { grid-row: 1; grid-column: 3; }
  .jrow .jmain { grid-row: 2; grid-column: 2 / -1; }
  .jrow .jmeta { grid-row: 3; grid-column: 2 / -1; justify-content: flex-start; }
}

/* ---------- drawer ---------- */
.drawer-wrap { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--paper); box-shadow: var(--shadow); display: flex; flex-direction: column; animation: slide .18s ease-out;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
.dh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; background: var(--sheet); border-bottom: 1px solid var(--line); }
.dh h3 { font-size: 20px; font-weight: 750; flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
.dbody { overflow-y: auto; padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 14px; font-size: 14px; }
.kv dt { color: var(--ink-3); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.minirows { display: flex; flex-direction: column; font-size: 13px; }
.minirows div { display: grid; grid-template-columns: 96px 100px minmax(0, 1fr) 56px; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.minirows div:first-child { border-top: 0; }
.minirows .h { text-align: right; font-family: var(--f-data); }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } .dot { animation: none; } }

/* ---------- tables ---------- */
.twrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 720px; }
table.t th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 9px 12px; border-bottom: 1px solid var(--line-2); background: var(--sheet-2); position: sticky; top: 0; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.num, table.t th.num { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t td.m { font-family: var(--f-data); font-size: 13px; white-space: nowrap; }
table.t tr.month td { background: var(--paper); font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 14px; color: var(--ink-2); padding-top: 14px; }
table.t tr.month td.num { font-family: var(--f-data); font-weight: 500; font-size: 13px; }
table.t tr.unb td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
table.t td.act { white-space: nowrap; text-align: right; }
.tscroll { max-height: 70vh; overflow-y: auto; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; white-space: nowrap; background: var(--sheet-2); color: var(--ink-2); display: inline-block; }
.pill.paid { background: var(--good-soft); color: var(--good); } .pill.due { background: var(--bad-soft); color: var(--bad); } .pill.warn { background: var(--warn-soft); color: var(--warn); }

/* bars */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 82px minmax(0, 1fr) 64px; gap: 4px 12px; align-items: center; font-size: 13px; }
.bar .jn { font-family: var(--f-data); }
.bar .tr { height: 10px; background: var(--sheet-2); border-radius: 2px; overflow: hidden; display: flex; }
.bar .tr i { display: block; height: 100%; background: var(--accent); }
.bar .tr i.u { background: var(--warn); }
.bar .hv { text-align: right; font-family: var(--f-data); }
.bar .cn { grid-column: 2; margin-top: -3px; font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--accent); }
.legend i.u { background: var(--warn); }

/* invoices */
.lines { display: flex; flex-direction: column; font-size: 14px; }
.lines .ln { display: grid; grid-template-columns: minmax(0, 1fr) 80px 120px 100px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.lines .ln.hd { border-top: 0; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding-top: 0; }
.lines .ln > :not(:first-child) { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines .ln.hd > :not(:first-child) { font-family: var(--f-body); }
.lines .ln.tot { border-top: 2px solid var(--ink); font-weight: 700; }
.lines .jn b { font-family: var(--f-data); font-weight: 500; } .lines .jn span { color: var(--ink-2); }
.ratebtn { background: none; border: 0; border-bottom: 1px dashed var(--ink-3); color: var(--accent); cursor: pointer; padding: 0 1px; font: inherit; }
.ratef { display: inline-flex; gap: 4px; justify-content: flex-end; }
.ratef input { width: 76px; padding: 3px 6px; text-align: right; }
.invgo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 12px; }
.invgo label { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.invgo input { width: 72px; }
.invgo .note { margin-right: auto; font-size: 12px; color: var(--ink-2); }
@media (max-width: 560px) { .lines .ln { grid-template-columns: minmax(0, 1fr) 56px 92px 78px; gap: 8px; font-size: 13px; } }
.ihist { display: flex; flex-direction: column; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.irow { border-top: 1px solid var(--line); }
.irow:first-child { border-top: 0; }
.ihead { display: grid; grid-template-columns: 18px 70px minmax(0, 1fr) 70px 96px auto; gap: 6px 12px; align-items: center; padding: 11px 14px; cursor: pointer; }
.ihead:hover { background: var(--sheet-2); }
.ihead .no { font-family: var(--f-data); font-weight: 500; }
.ihead .per { font-size: 13px; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.ihead .h, .ihead .m { font-family: var(--f-data); text-align: right; white-space: nowrap; }
.ihead .m { font-weight: 600; }
.ihead .st { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.chev { width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; }
.open > .ihead .chev { transform: rotate(45deg); }
.idet { padding: 2px 14px 14px 44px; }
@media (max-width: 640px) { .ihead { grid-template-columns: 18px auto minmax(0, 1fr) auto; } .ihead .per, .ihead .h { grid-column: 2 / -1; text-align: left; } .ihead .st { grid-column: 2 / -1; justify-content: flex-start; } .idet { padding-left: 14px; } }

/* notes */
.ncard { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
.ncard > summary, .ngroup > summary { list-style: none; cursor: pointer; }
.ncard > summary::-webkit-details-marker, .ngroup > summary::-webkit-details-marker { display: none; }
.ncard > summary { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 12px 14px; }
.ncard > summary .cl { font-weight: 600; }
.ncard > summary .pv { flex: 1 1 100%; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ncard[open] > summary .pv { display: none; }
.ncard[open] > summary { border-bottom: 1px solid var(--line); }
.nbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.ngroup { border: 1px solid var(--line); border-radius: var(--r); }
.ngroup > summary { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--sheet-2); border-radius: var(--r); font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.ngroup > summary .c { font-weight: 500; letter-spacing: 0; text-transform: none; }
.ngroup[open] > summary { border-radius: var(--r) var(--r) 0 0; }
.nitems { display: flex; flex-direction: column; }
.nitem { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); }
.nitem:first-child { border-top: 0; }
.qa { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.qa .L { font-family: var(--f-data); font-size: 11px; text-align: center; border-radius: 3px; padding: 1px 0; color: var(--accent); border: 1px solid var(--accent); }
.qa.a .L { color: var(--good); border-color: var(--good); }
.qa .q { font-weight: 600; overflow-wrap: anywhere; } .qa .t { white-space: pre-wrap; overflow-wrap: anywhere; }
.qa.pending .L { color: var(--warn); border-color: var(--warn); }
.ansf { display: flex; gap: 8px; align-items: flex-start; }
.ansf textarea { flex: 1 1 auto; min-height: 38px; }
.snaps { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 30px; }
.snap { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; max-width: 100%; }
.snap img { display: block; max-width: 100%; max-height: 200px; border: 1px solid var(--line); border-radius: 4px; }
.ntools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 30px; }
.ntools select { padding: 3px 6px; font-size: 12px; }
.ntools .btn { padding: 3px 9px; font-size: 12px; }
.ntools .sp { flex: 1; }
.nform { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line-2); padding-top: 12px; }
.pair { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--sheet-2); border-radius: var(--r); }
.frow { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.frow .msg { margin-right: auto; font-size: 12px; color: var(--ink-2); }
.filterchip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 600; }
.filterchip button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }

/* minutes rich text */
.rich { display: flex; flex-direction: column; gap: 4px; }
.rbar { display: flex; gap: 4px; flex-wrap: wrap; }
.rbar button { padding: 3px 10px; font-size: 13px; }
.rbar .b { font-weight: 800; } .rbar .i { font-style: italic; } .rbar .u { text-decoration: underline; }
.ed { min-height: 160px; max-height: 55vh; overflow-y: auto; overflow-wrap: anywhere; line-height: 1.5; font-weight: 400; color: var(--ink); }
.ed:empty::before { content: attr(data-ph); color: var(--ink-3); }
.ed ul, .ed ol, .rt ul, .rt ol { margin: 4px 0; padding-left: 22px; }
.mblk { display: flex; flex-direction: column; gap: 2px; }
.mblk .l { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.mblk .t { white-space: pre-wrap; overflow-wrap: anywhere; }

/* toasts */
#toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; max-width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 10px 14px; font-size: 14px; box-shadow: var(--shadow); overflow-wrap: anywhere; animation: tin .18s ease-out; }
.toast.err { background: var(--bad); color: #fff; }
.toast.ok { background: var(--good); color: var(--paper); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
.punch.late { background: var(--warn-soft); border-color: var(--warn); }
.punch.late .dot { background: var(--warn); }
.latemsg { font-size: 12px; font-weight: 600; color: var(--warn); }
.pfix { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pfix input { padding: 4px 6px; }
.dupwarn { font-size: 13px; color: var(--bad); background: var(--bad-soft); border-radius: var(--r); padding: 8px 12px; }
.invgo .note b { font-weight: 600; color: var(--ink); }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.oqtext { font-family: var(--f-data); font-size: 12.5px; line-height: 1.5; background: var(--sheet-2); }
.oqh { min-width: 0; overflow-wrap: anywhere; }
ol.oq { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
ol.oq li { overflow-wrap: anywhere; }
ul.acts { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
ul.acts .check { color: var(--ink); font-size: 14px; align-items: flex-start; }
ul.acts .check input { margin-top: 2px; flex: 0 0 auto; }
ul.acts li.done span { text-decoration: line-through; color: var(--ink-3); }
.banner { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: var(--r); padding: 8px 12px; }
